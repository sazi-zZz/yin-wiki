<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="css/img/favicon.png">
    <script src="js/script.js"></script>
    <title>Contact Yin Wiki</title>
</head>

<body>
    <div class="contact-section">
        <div class="contact-title">
            <h1>Contact Yin Wiki</h1>
        </div>
        <div class="contact-container">
            <h2>Email</h2>
            <p>For inquiries, please visit: <a href="https://www.sazedur.space/">sazedur.space</a></p>
        </div>
        <div class="maps">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d456.0689609606639!2d90.39675978728081!3d23.8700482273701!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755c43cb53ea717%3A0xdaa7e1216a0482c7!2s7%20Number%20Park%2C%20Uttara%2C%20Dhaka%201230!5e0!3m2!1sen!2sbd!4v1760441269043!5m2!1sen!2sbd"
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div class="contact-form">
            <h2>Contact Form</h2>
            <form action="#" method="">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="_replyto" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" required></textarea><br><br>

                <button type="submit">Send</button>
            </form>
        </div>
    </div>
    <div class="go-home">
        <a href="index2.html">Go Home</a>
    </div>
</body>

</html>
